<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-swipe-cards: Tinder-style swipeable card stack for Jetpack Compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset="1" stop-color="#3b0d3a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="skyBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="skyBack2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#123047"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="card">
      <rect x="0" y="0" width="300" height="400" rx="28"/>
    </clipPath>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="'Google Sans', Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="200" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="-2">compose-swipe-cards</text>
    <text x="82" y="254" fill="#fbcfe8" font-size="27" font-weight="500">Tinder-style swipeable card stack for Jetpack Compose:</text>
    <text x="82" y="290" fill="#fbcfe8" font-size="27" font-weight="500">fling decisions, undo, overlays, haptics and TalkBack</text>
    <text x="82" y="352" fill="#f9a8d4" font-size="20" font-family="'JetBrains Mono', Menlo, monospace">SwipeCardStack(items, state, onSwiped) { Card(it) }</text>

    <g font-size="18" font-weight="600" fill="#fce7f3">
      <rect x="82" y="386" width="94" height="38" rx="19" fill="#22c55e" fill-opacity="0.25"/>
      <text x="129" y="411" text-anchor="middle">Like</text>
      <rect x="188" y="386" width="100" height="38" rx="19" fill="#f43f5e" fill-opacity="0.25"/>
      <text x="238" y="411" text-anchor="middle">Nope</text>
      <rect x="300" y="386" width="124" height="38" rx="19" fill="#3b82f6" fill-opacity="0.3"/>
      <text x="362" y="411" text-anchor="middle">Super like</text>
      <rect x="436" y="386" width="94" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="483" y="411" text-anchor="middle">Undo</text>
      <rect x="542" y="386" width="112" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="598" y="411" text-anchor="middle">Haptics</text>
    </g>

    <!-- Cards behind -->
    <g transform="translate(850 110) scale(0.9) translate(16 64)" filter="url(#shadow)">
      <g clip-path="url(#card)">
        <rect width="300" height="400" fill="url(#skyBack2)"/>
        <path d="M0 270 L40 210 L80 250 L130 190 L180 260 L230 200 L300 250 L300 400 L0 400 Z" fill="#1e3a4c"/>
      </g>
    </g>
    <g transform="translate(850 100) scale(0.95) translate(8 44)" filter="url(#shadow)">
      <g clip-path="url(#card)">
        <rect width="300" height="400" fill="url(#skyBack)"/>
        <path d="M0 250 L60 180 L100 220 L160 140 L220 230 L260 190 L300 230 L300 400 L0 400 Z" fill="#64748b"/>
        <path d="M0 300 L300 290 L300 400 L0 400 Z" fill="#2dd4bf"/>
      </g>
    </g>

    <!-- Top card, dragged to the right -->
    <g transform="translate(900 70) rotate(8 150 400)" filter="url(#shadow)">
      <g clip-path="url(#card)">
        <rect width="300" height="400" fill="url(#sky)"/>
        <circle cx="70" cy="200" r="26" fill="#fff7ed"/>
        <path d="M0 250 L40 238 L60 226 L90 240 L140 228 L160 214 L190 236 L250 222 L280 236 L300 240 L300 400 L0 400 Z" fill="#d6a77a"/>
        <path d="M30 330 L36 262 Q42 252 48 262 L54 330 Z M100 330 L106 276 Q112 266 118 276 L124 330 Z M220 330 L226 262 Q232 252 238 262 L244 330 Z" fill="#b7794b"/>
        <circle cx="190" cy="90" r="24" fill="#ef4444"/>
        <path d="M172 100 L208 100 L197 120 L183 120 Z" fill="#ef4444"/>
        <rect x="185" y="123" width="10" height="8" fill="#78350f"/>
        <circle cx="250" cy="140" r="17" fill="#3b82f6"/>
        <path d="M237 147 L263 147 L255 161 L245 161 Z" fill="#3b82f6"/>
        <circle cx="120" cy="120" r="14" fill="#f59e0b"/>
        <path d="M109 126 L131 126 L124 138 L116 138 Z" fill="#f59e0b"/>
        <rect width="300" height="400" fill="url(#scrim)"/>
        <text x="22" y="350" fill="#ffffff" font-size="30" font-weight="800">Cappadocia</text>
        <text x="22" y="376" fill="#ffffff" fill-opacity="0.85" font-size="15" font-weight="500">Türkiye · best Apr to Jun</text>
        <g transform="rotate(-15 80 60)">
          <rect x="24" y="36" width="112" height="50" rx="10" fill="none" stroke="#22c55e" stroke-width="4"/>
          <text x="80" y="73" fill="#22c55e" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="3">LIKE</text>
        </g>
      </g>
    </g>
  </g>
</svg>
